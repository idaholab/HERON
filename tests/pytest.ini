#
# pytest configuration for HERON tests. RAVEN's test harness (run_tests) does not use this file.
#
# Running without RAVEN, from the HERON directory:
#   pytest -c tests/pytest.ini --no-raven tests/unit_tests
# or from the tests directory:
#   pytest --no-raven
# (from any other directory, pass the test path explicitly; pytest ignores testpaths there and would
# otherwise recurse through the build_cfg/HERON symlink). This
# collects only the files listed in raven_free_files and runs only their tests marked
# @pytest.mark.raven_free, with RAVEN, TEAL, and FARM imports blocked. Add a file here once all of
# its imports work without RAVEN, then mark the tests in it that pass without RAVEN.

[pytest]
testpaths = unit_tests
python_files = test_*.py
# collect only unittest.TestCase subclasses, not the Test*Base mixin classes used by the snippet tests
python_classes =
addopts = --strict-markers -p no:cacheprovider
markers =
  raven_free: test runs without RAVEN, TEAL, or FARM installed (selected by --no-raven)

# paths relative to this file
raven_free_files =
  unit_tests/test_raven_optional.py
  unit_tests/test_listproperty.py
  unit_tests/inspect_data/test_inspect_data.py
  unit_tests/snippets/test_base.py
  unit_tests/snippets/test_databases.py
  unit_tests/snippets/test_dataobjects.py
  unit_tests/snippets/test_factory.py
  unit_tests/snippets/test_files.py
  unit_tests/snippets/test_models.py
  unit_tests/snippets/test_optimizers.py
  unit_tests/snippets/test_outstreams.py
  unit_tests/snippets/test_runinfo.py
  unit_tests/snippets/test_samplers.py
  unit_tests/snippets/test_steps.py
  unit_tests/snippets/test_variablegroups.py
